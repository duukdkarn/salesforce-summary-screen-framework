<template>
  <div class="sectionBox slds-box">
    <!-- Header row (hidden in bare mode) -->
    <template if:true={showHeader}>
      <div class="slds-grid sectionHeader"
           role="button"
           tabindex="0"
           aria-expanded={headerAriaExpanded}
           aria-label={title}
           onclick={toggleExpanded}
           onkeydown={handleHeaderKeydown}>
        <div class="chevronColumn">
          <lightning-icon icon-name={chevronIcon} size="xx-small" alternative-text="Toggle"></lightning-icon>
        </div>
        <div class="slds-col collapseTitleContainer">
          <h4 class={computedTitleClass} title={title}>{title}</h4>
        </div>
      </div>
    </template>
    
    <!-- Body (always visible in bare mode, collapsible otherwise) -->
    <template if:true={showBody}>
      <div class="sectionBodyWrapper">
        <!-- Spacer column (only when not bare) -->
        <template if:false={bare}>
          <div class="chevronColumn"></div>
        </template>
        <div class="sectionBody" role="list" aria-label="Documents">
          <template for:each={fields} for:item="field">
            <c-summary-field key={field.label} label={field.label} value={field.value} hr-required={field.hrRequired} render-as-badge={renderAsBadge}></c-summary-field>
          </template>
          <template if:true={needsMidRule}>
            <div class="slds-border_bottom slds-var-m-vertical_small"></div>
          </template>
          <template for:each={docsUi} for:item="doc">
            <div key={doc.key} role="listitem" class="docRow slds-grid slds-gutters slds-grid_align-spread">
              <div class="slds-col slds-size_5-of-12 slds-text-color_weak">{doc.label}</div>
              <div class="slds-col slds-size_7-of-12 slds-truncate">
                <template if:true={doc.hasLink}>
                  <a class="docLink slds-grid slds-grid_vertical-align-center" href={doc.href} target="_blank" rel="noopener" aria-label={doc.ariaLabel} title={doc.title}>
                    <lightning-icon icon-name={doc.iconName} size="small" class="slds-m-right_x-small"></lightning-icon>
                    <span class="slds-truncate">{doc.title}</span>
                  </a>
                </template>
                <template if:false={doc.hasLink}>
                  <div class="slds-grid slds-grid_vertical-align-center" aria-label="No document available">
                    <span class="slds-truncate">--</span>
                  </div>
                </template>
              </div>
            </div>
            <!-- Rule after each doc except last -->
            <template if:true={doc.hrRequired}>
              <div key={doc.ruleKey} class="slds-border_bottom slds-var-m-vertical_small"></div>
            </template>
          </template>
        </div>
      </div>
    </template>
  </div>
</template>
